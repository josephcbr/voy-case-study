version: 2

sources:
  - name: raw
    schema: raw
    tables:
      - name: customers
        description: One row per customer. Loaded from customers.csv.
      - name: activity
        description: >
          One row per subscription period. from_date/to_date mark the
          active window for that subscription_id. Loaded from activity.csv.
      - name: acq_orders
        description: >
          One row per customer acquisition order, with the acquisition
          taxonomy category. Loaded from acq_orders.csv.
