version: 2

models:
  - name: stg_activity
    description: One row per subscription renewal period.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "to_date >= from_date"
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_id
              - subscription_id
              - from_date
              - to_date
    columns:
      - name: customer_id
        data_type: bigint
        description: Foreign key to stg_customers.

      - name: subscription_id
        data_type: bigint
        description: >
          Identifier for a recurring subscription. Not unique on its own -
          a subscription has one row per renewal period (see from_date).
        data_tests:
          - not_null

      - name: from_date
        data_type: date
        description: Date the subscription period started.

      - name: to_date
        data_type: date
        description: Date the subscription period ended.
