name: 'voy_case_study'
version: '1.0.0'
config-version: 2

profile: 'voy_case_study'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Raw activity.csv actually runs to 2024-08-16, but the last ~3 weeks of
  # that (roughly Aug 1-16) contain a snapshot artifact: a subset of
  # subscriptions get two rows per day (a 0-day and a 1-day period on the
  # same from_date). Pinning current_date to 2024-07-24 - safely before that
  # window - avoids the whole model tree needing to reason about it, at the
  # cost of ~3 weeks of the most recent activity. See docs/approach.md.
  current_date: "date('2024-07-24')"

models:
  voy_case_study:
    staging:
      +materialized: view
    core:
      +materialized: table
    marts:
      +materialized: table
